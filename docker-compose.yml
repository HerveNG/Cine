services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filmfund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filmfund}
      POSTGRES_DB: ${POSTGRES_DB:-filmfund}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filmfund}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-filmfund}:${POSTGRES_PASSWORD:-filmfund}@postgres:5432/${POSTGRES_DB:-filmfund}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # n8n is scaffolded here for Phase 6 (automated funding watch,
  # notifications). The FilmFund side of the pipeline (follow, notify,
  # webhook) is real and tested — see n8n/README.md. The workflow itself
  # is a template (n8n/workflows/funding-watch.example.json) to import
  # and adapt per fund, not a running automation out of the box.
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    profiles: ["automation"]
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-changeme}
      # Used by the example workflow to call the backend webhook.
      FILMFUND_API_URL: ${FILMFUND_API_URL:-http://backend:8000}
      FILMFUND_N8N_SECRET: ${N8N_WEBHOOK_SECRET:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
